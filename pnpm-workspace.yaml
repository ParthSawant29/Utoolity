packages:
  - "apps/*"
  - "packages/*"
  - "packages/config/*"

allowedDeprecatedVersions:
  fluent-ffmpeg: "*"
  multer: "*"
  eslint: "*"

catalog:
  # ─────────────────────────────────────────────
  # React ecosystem
  # ─────────────────────────────────────────────
  react: 19.2.6
  react-dom: 19.2.6

  # ─────────────────────────────────────────────
  # Next.js
  # ─────────────────────────────────────────────
  next: 16.2.11
  "@next/eslint-plugin-next": 16.2.11
  eslint-config-next: 16.2.11

  # ─────────────────────────────────────────────
  # Tailwind CSS
  # ─────────────────────────────────────────────
  tailwindcss: 4.3.0
  "@tailwindcss/postcss": 4.3.0
  "@tailwindcss/cli": 4.3.0
  autoprefixer: 10.4.23

  # ─────────────────────────────────────────────
  # TypeScript & ESLint
  # ─────────────────────────────────────────────
  typescript: 6.0.3
  eslint: 9.39.4
  typescript-eslint: 8.60.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.2
  "@eslint/js": 9.39.4
  globals: 17.6.0

  # ESLint plugins
  eslint-config-prettier: 10.1.1
  eslint-plugin-only-warn: 1.1.0
  eslint-plugin-react: 7.37.5
  eslint-plugin-turbo: 2.6.0

  # ─────────────────────────────────────────────
  # Types
  # ─────────────────────────────────────────────
  "@types/node": 25.9.1
  "@types/react": 19.2.15
  "@types/react-dom": 19.2.3

  # ─────────────────────────────────────────────
  # Build tools
  # ─────────────────────────────────────────────
  postcss: 8.5.23
  turbo: 2.9.16

  # ─────────────────────────────────────────────
  # UI utilities
  # ─────────────────────────────────────────────
  cn: 0.2.6
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.6.0
  tw-animate-css: 1.4.0

  # ─────────────────────────────────────────────
  # Radix UI
  # ─────────────────────────────────────────────
  "@radix-ui/react-slot": 1.2.3
  "@radix-ui/react-dialog": 1.1.15
  "@radix-ui/react-tooltip": 1.2.16
  "@radix-ui/react-dropdown-menu": 2.1.14
  "@radix-ui/react-select": 2.2.4
  "@radix-ui/react-label": 2.1.2
  "@radix-ui/react-popover": 1.1.14
  radix-ui: 1.4.3

  # ─────────────────────────────────────────────
  # Icons
  # ─────────────────────────────────────────────
  lucide-react: 1.17.0

  # ─────────────────────────────────────────────
  # Animation
  # ─────────────────────────────────────────────
  framer-motion: 12.40.0
  gsap: 3.15.0

  # ─────────────────────────────────────────────
  # Prettier
  # ─────────────────────────────────────────────
  prettier: 3.8.3
  prettier-plugin-astro: 0.14.1

  # ─────────────────────────────────────────────
  # Backend runtime
  # ─────────────────────────────────────────────
  express: 4.19.2
  cors: 2.8.5
  dotenv: 16.4.5
  multer: 1.4.5-lts.1
  fluent-ffmpeg: 2.1.3
  sharp: 0.33.4
  zod: 3.23.8
  uuid: 9.0.1

  # ─────────────────────────────────────────────
  # Backend dev tooling
  # ─────────────────────────────────────────────
  tsx: 4.16.2

  # ─────────────────────────────────────────────
  # Backend types
  # ─────────────────────────────────────────────
  "@types/express": 4.17.21
  "@types/cors": 2.8.17
  "@types/multer": 1.4.11
  "@types/fluent-ffmpeg": 2.1.24
  "@types/uuid": 9.0.8

allowBuilds:
  bcrypt: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: true
  "@parcel/watcher": true